<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="en nettside om planeten Mars" />
    <title>Planet Prosjekt</title>
    <link rel="shortcut icon" href="images/mars.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header id="home">
      <div class="content">
        <a class="logo" href="#home">Mars</a>
        <nav>
          <ul class="menu">
            <li><a href="#home">Hjem</a></li>
            <li><a href="#gallery">Galleri</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Main -->
    <main>
      <section class="hero">
        <div class="content">
          <p class="label">Solsystem</p>
          <h1>Mars</h1>
          <p>
            Ofte kalt den røde planeten, Mars er oppkalt etter den romerske
            krigsguden med samme navn og er den fjerde planeten i vårt
            solsystem. Den har to måner, Phobos og Deimos.
          </p>
          <a class="button" href="#gallery">Se bilder</a>
        </div>
      </section>

      <!-- Galleri -->
      <section id="gallery" class="section">
        <div class="content">
          <h2>Bilder</h2>
          <div class="gallery">
            <!-- Bilder -->
            <img src="images/ancient_mars.jpg" alt="Kollisjon med Mars" />
            <img src="images/earth_mars.jpg" alt="Jorden og Mars" />
            <img src="images/surface.jpg" alt="Overflaten til Mars" />
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <div class="content">
        <p>Bilder: NASA</p>
        <p>Informasjon: Wikipedia</p>
        <p>Ikon: Laget av Magnific</p>
      </div>
    </footer>
  </body>
</html>
